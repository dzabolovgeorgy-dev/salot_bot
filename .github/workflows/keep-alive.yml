name: Не давать серверу заснуть

# Render на бесплатном тарифе "усыпляет" сервер после ~15 минут без обращений,
# и следующий запрос после этого ждёт 30-60+ секунд, пока сервер проснётся —
# именно из-за этого бот в Telegram кажется "зависшим". Этот файл каждые
# 10 минут дёргает сервер простым запросом, чтобы он не засыпал

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: curl -sf https://salot-bot.onrender.com/api/health
